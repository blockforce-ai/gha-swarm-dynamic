name: demo-bov ops

# Operações de infraestrutura do ambiente de demonstração `demo-bov`
# (cliente `bov`, ambiente `demo`, branch `demo-bov`).
#
# POR QUE ESTE WORKFLOW EXISTE
# O swarm manager só é alcançável por SSH com a chave que vive nos secrets da
# organização. Os runners self-hosted (label `blockforce-swarm`) já rodam com
# esses secrets, então toda operação de infra do ambiente novo passa por aqui —
# reprodutível e auditável, em vez de SSH manual da máquina de alguém.
#
# NADA AQUI TOCA O AMBIENTE `cea-dev` (demo atual). Todos os recursos criados
# têm o sufixo `-bov` ou `bov-demo`, e o `preflight` verifica isso antes.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "operação"
        required: true
        default: preflight
        type: choice
        options:
          - preflight        # read-only: capacidade, Postgres, rede, snapshot do cea
          - create-databases # CREATE DATABASE x5 (idempotente)
          - infra-up         # stack infra-bov-demo: dgraph-zero, dgraph-alpha, redis
          - infra-status     # read-only: estado da stack infra-bov-demo
          - infra-down       # remove a stack infra-bov-demo (mantém os bancos)
          - drop-databases   # DROP DATABASE x5 — destrutivo, exige confirm
      confirm:
        description: "digite DESTRUIR para as ações destrutivas"
        required: false
        default: ""
        type: string

concurrency:
  group: demo-bov-ops
  cancel-in-progress: false

jobs:
  ops:
    name: ${{ inputs.action }}
    runs-on: [self-hosted, blockforce-swarm]
    steps:
      - uses: actions/checkout@v4

      - name: Prepara chave SSH do swarm
        shell: bash
        env:
          SWARM_SSH_KEY: ${{ secrets.SWARM_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$RUNNER_TEMP/.ssh"
          printf '%s\n' "$SWARM_SSH_KEY" > "$RUNNER_TEMP/.ssh/swarm"
          chmod 600 "$RUNNER_TEMP/.ssh/swarm"

      - name: Executa
        shell: bash
        env:
          SWARM_HOST: ${{ secrets.SWARM_MANAGER_HOST_NP }}
          SWARM_USER: ${{ secrets.SWARM_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD_SHARED_DEV }}
          ACTION: ${{ inputs.action }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail

          SSH_OPTS="-i $RUNNER_TEMP/.ssh/swarm -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15"
          sh_swarm() { ssh $SSH_OPTS "${SWARM_USER}@${SWARM_HOST}" "$@"; }

          # Os 5 bancos do ambiente bov. `DB_SCHEMA` das apps é o NOME DO BANCO
          # (typeorm.config.ts: `database: configs.env.DB_SCHEMA`), então o
          # isolamento é por banco, não por schema. Sem eles a migration de boot
          # falha e o container entra em crash-loop.
          DBS="tenant-api-bov traceability-api-bov traceability-platform-api-bov dpp-api-bov compliance360-api-bov"

          # Descobre o container do Postgres no manager (pode ter nome de task do swarm).
          find_pg() {
            sh_swarm "docker ps --filter 'name=postgres' --format '{{.Names}}' | head -1"
          }

          psql_do() {
            local sql="$1"
            local pg; pg="$(find_pg)"
            if [ -z "$pg" ]; then echo "::error::container do Postgres não encontrado no manager"; exit 1; fi
            sh_swarm "docker exec -e PGPASSWORD='${DB_PASSWORD}' '$pg' psql -U postgres -tAc \"$sql\""
          }

          case "$ACTION" in

          preflight)
            echo "## Pré-voo demo-bov" >> "$GITHUB_STEP_SUMMARY"

            echo "### Nós e capacidade"
            sh_swarm 'docker node ls; echo; free -h; echo; df -h / | tail -1'

            echo "### Stacks existentes"
            sh_swarm 'docker stack ls'

            echo "### Rede blockforce (precisa ser attachable para o psql transiente)"
            sh_swarm "docker network inspect blockforce --format 'driver={{.Driver}} attachable={{.Attachable}} scope={{.Scope}}' || echo 'AUSENTE'"

            echo "### Postgres"
            PG="$(find_pg)"
            echo "container no manager: ${PG:-<não encontrado>}"
            if [ -z "$PG" ]; then
              # Pode estar num worker. Descobre onde, para saber se dá para usar
              # `docker exec` ou se o seed vai precisar de um container transiente.
              echo "-- procurando como service do swarm --"
              sh_swarm "docker service ls --format '{{.Name}}' | grep -i postgres || echo 'nenhum service postgres'"
              sh_swarm "for s in \$(docker service ls --format '{{.Name}}' | grep -i postgres); do docker service ps \$s --format '{{.Name}}\t{{.Node}}\t{{.CurrentState}}' --filter desired-state=running; done" || true
            fi
            if [ -n "$PG" ]; then
              echo "-- versão e permissão de CREATEDB --"
              psql_do "SELECT version()"
              psql_do "SELECT rolcreatedb FROM pg_roles WHERE rolname = current_user"
              echo "-- bancos existentes --"
              psql_do "SELECT datname FROM pg_database WHERE NOT datistemplate ORDER BY 1"
              echo "-- nomes alvo já em uso? (vazio = livre) --"
              for d in $DBS; do
                r="$(psql_do "SELECT 1 FROM pg_database WHERE datname = '$d'")"
                [ -n "$r" ] && echo "  OCUPADO: $d" || echo "  livre:   $d"
              done
            fi

            echo "### Dgraph e Redis do cea (referência de nomes)"
            sh_swarm "docker service ls --format '{{.Name}}\t{{.Replicas}}\t{{.Image}}' | grep -Ei 'dgraph|redis' || echo 'nenhum'"

            # Rede de segurança: se algo der errado e o cea-dev for atingido,
            # estas são as imagens para restaurar via `docker service update --image`.
            echo "### Snapshot das imagens do cea-dev (rollback)"
            sh_swarm "docker service ls --format '{{.Name}}' | grep -- '-cea-dev' | while read s; do printf '%s\t%s\n' \"\$s\" \"\$(docker service inspect \$s --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}')\"; done" | tee cea-dev-images.txt

            echo "### Verificação de isolamento"
            sh_swarm "docker service ls --format '{{.Name}}' | grep -c -- 'bov' || true" | sed 's/^/services com \"bov\" hoje: /'
            ;;

          create-databases)
            echo "Criando bancos (idempotente)…"
            for d in $DBS; do
              exists="$(psql_do "SELECT 1 FROM pg_database WHERE datname = '$d'")"
              if [ -n "$exists" ]; then
                echo "  = $d já existe"
              else
                psql_do "CREATE DATABASE \\\"$d\\\"" >/dev/null
                echo "  + $d criado"
              fi
            done
            echo "-- conferência --"
            psql_do "SELECT datname FROM pg_database WHERE datname LIKE '%-bov' ORDER BY 1"
            ;;

          infra-up)
            echo "Subindo stack infra-bov-demo (dgraph + redis dedicados)…"
            # Sem `ports:` de propósito: o pipeline compartilhado não publica portas
            # e o acesso é por DNS interno da rede overlay. Publicar colidiria com
            # o Dgraph do cea (9080/8082).
            cat > /tmp/infra-bov-demo.yml <<'YAML'
          version: "3.8"

          services:
            dgraph-zero-bov-demo:
              image: dgraph/dgraph:v23.1.0
              command: dgraph zero --my=dgraph-zero-bov-demo:5080 --replicas 1
              networks: [blockforce]
              volumes:
                - dgraph-bov-demo-zero:/dgraph
              deploy:
                replicas: 1
                restart_policy: { condition: any }
                resources:
                  limits: { memory: 512M }

            dgraph-alpha-bov-demo:
              image: dgraph/dgraph:v23.1.0
              command: dgraph alpha --my=dgraph-alpha-bov-demo:7080 --zero=dgraph-zero-bov-demo:5080 --security whitelist=0.0.0.0/0
              networks: [blockforce]
              volumes:
                - dgraph-bov-demo-alpha:/dgraph
              depends_on: [dgraph-zero-bov-demo]
              deploy:
                replicas: 1
                restart_policy: { condition: any }
                resources:
                  limits: { memory: 2G }

            redis-bov-demo:
              image: redis:7-alpine
              command: redis-server --appendonly yes
              networks: [blockforce]
              volumes:
                - redis-bov-demo:/data
              deploy:
                replicas: 1
                restart_policy: { condition: any }
                resources:
                  limits: { memory: 256M }

          networks:
            blockforce:
              external: true

          volumes:
            dgraph-bov-demo-zero:
            dgraph-bov-demo-alpha:
            redis-bov-demo:
          YAML
            scp $SSH_OPTS /tmp/infra-bov-demo.yml "${SWARM_USER}@${SWARM_HOST}:/tmp/infra-bov-demo.yml"
            sh_swarm "docker stack deploy -c /tmp/infra-bov-demo.yml infra-bov-demo && rm -f /tmp/infra-bov-demo.yml"
            echo "aguardando convergência…"
            sleep 25
            sh_swarm "docker service ls --filter name=infra-bov-demo"
            ;;

          infra-status)
            sh_swarm "docker stack ps infra-bov-demo --no-trunc || echo 'stack ausente'"
            sh_swarm "docker service ls --filter name=infra-bov-demo"
            ;;

          infra-down)
            [ "$CONFIRM" = "DESTRUIR" ] || { echo "::error::confirm != DESTRUIR"; exit 1; }
            sh_swarm "docker stack rm infra-bov-demo"
            echo "stack removida (volumes preservados)"
            ;;

          drop-databases)
            [ "$CONFIRM" = "DESTRUIR" ] || { echo "::error::confirm != DESTRUIR"; exit 1; }
            for d in $DBS; do
              psql_do "DROP DATABASE IF EXISTS \\\"$d\\\"" >/dev/null && echo "  - $d removido"
            done
            ;;

          *)
            echo "::error::ação desconhecida: $ACTION"; exit 1 ;;
          esac

      - name: Publica snapshot de rollback
        if: inputs.action == 'preflight'
        uses: actions/upload-artifact@v4
        with:
          name: cea-dev-images
          path: cea-dev-images.txt
          if-no-files-found: warn

      - name: Limpa chave
        if: always()
        run: rm -f "$RUNNER_TEMP/.ssh/swarm"

name: demo-bov ops

# Operações de infra do ambiente de demonstração `demo-bov`.
# A lógica vive em scripts/demo-bov-ops.sh — este workflow só orquestra,
# no mesmo padrão do pipeline reutilizável com generate-stack.sh/deploy-stack.sh.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "operação"
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - create-databases
          - infra-up
          - infra-status
          - infra-down
          - drop-databases
      confirm:
        description: "digite DESTRUIR para as ações destrutivas"
        required: false
        default: ""
        type: string

concurrency:
  group: demo-bov-ops
  cancel-in-progress: false

jobs:
  ops:
    name: ${{ inputs.action }}
    runs-on: [self-hosted, blockforce-swarm]
    steps:
      - uses: actions/checkout@v4

      - name: Run ops
        env:
          ACTION: ${{ inputs.action }}
          CONFIRM: ${{ inputs.confirm }}
          SWARM_HOST: ${{ secrets.SWARM_MANAGER_HOST_NP }}
          SWARM_USER: ${{ secrets.SWARM_USER }}
          SWARM_SSH_KEY: ${{ secrets.SWARM_SSH_PRIVATE_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD_SHARED_DEV }}
        run: bash scripts/demo-bov-ops.sh

      - name: Upload snapshot de rollback
        if: inputs.action == 'preflight'
        uses: actions/upload-artifact@v4
        with:
          name: cea-dev-images
          path: cea-dev-images.txt
          if-no-files-found: warn

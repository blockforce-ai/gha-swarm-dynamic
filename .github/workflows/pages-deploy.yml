name: Reusable Pipeline (Cloudflare Pages)

on:
  workflow_call:
    inputs:
      project_name:
        description: Cloudflare Pages project name
        required: true
        type: string
      build_output_dir:
        description: Build output directory
        required: false
        type: string
        default: "."
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

jobs:
  deploy:
    name: Deploy Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy "${{ inputs.build_output_dir }}" --project-name="${{ inputs.project_name }}" --branch="${GITHUB_REF_NAME}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

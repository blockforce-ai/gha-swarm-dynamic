name: Reusable Pipeline (Swarm Single Stack)

permissions:
  contents: read
  packages: write

on:
  workflow_call:
    inputs:
      service_name:
        description: "Nome da imagem no registry (ex: agents-dashboard)"
        required: true
        type: string
      stack_name:
        description: "Nome do stack no Swarm"
        required: true
        type: string
      swarm_service:
        description: "Nome do service dentro do stack (para o sanity check de rollback)"
        required: true
        type: string
      swarm_host:
        description: "IP/host do manager Swarm de destino"
        required: true
        type: string
      swarm_host_key:
        description: "Host key publica do manager (ex: 'ssh-ed25519 AAAA...'). Obtida por canal confiavel: cat /etc/ssh/ssh_host_ed25519_key.pub"
        required: true
        type: string
      swarm_user:
        description: "Usuario SSH do deploy no manager"
        required: false
        type: string
        default: "deploy"
      stack_file:
        description: "Compose do stack. O bloco 'secrets:' precisa ter a chave <env_secret_name> com exatamente 2 espacos de indentacao (o workflow falha se nao achar)."
        required: false
        type: string
        default: "deploy/stack.yml"
      dockerfile:
        required: false
        type: string
        default: "Dockerfile"
      context:
        required: false
        type: string
        default: "."
      env_secret_name:
        description: "Nome base do Docker secret (versionado com o sha a cada deploy)"
        required: true
        type: string
      vault_path:
        description: "Path no Vault sem prefixo: <client>/<env>/<service> (ex: blockforce/prod/agents-dashboard)"
        required: true
        type: string
      health_url:
        description: "URL local (na VPS) testada apos o deploy"
        required: false
        type: string
        default: ""
      registry:
        required: false
        type: string
        default: "ghcr.io"
    secrets:
      SWARM_SSH_PRIVATE_KEY:
        required: true
      GHCR_PAT:
        required: true
      VAULT_ADDR:
        required: true
      VAULT_TOKEN:
        description: "Token read-only (policy deploy-read)"
        required: true

concurrency:
  group: swarm-single-${{ inputs.stack_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & push
    runs-on: [self-hosted, blockforce-swarm]
    outputs:
      image: ${{ steps.meta.outputs.image }}
    env:
      DOCKER_CONFIG: /tmp/docker-${{ github.run_id }}-${{ inputs.stack_name }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        shell: bash
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=${{ inputs.registry }}/${OWNER}/${{ inputs.service_name }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build & push
        shell: bash
        run: |
          set -euo pipefail
          IMG='${{ steps.meta.outputs.image }}'
          docker build --file '${{ inputs.dockerfile }}' --tag "$IMG" '${{ inputs.context }}'
          docker push "$IMG"

  deploy:
    name: Deploy ${{ inputs.stack_name }}
    needs: build
    runs-on: [self-hosted, blockforce-swarm]
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        shell: bash
        env:
          SWARM_HOST: ${{ inputs.swarm_host }}
          SWARM_USER: ${{ inputs.swarm_user }}
          SSH_KEY: ${{ secrets.SWARM_SSH_PRIVATE_KEY }}
          GHCR_TOKEN: ${{ secrets.GHCR_PAT }}
          GHCR_USER: ${{ github.repository_owner }}
          HOST_KEY: ${{ inputs.swarm_host_key }}
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          VAULT_PATH: ${{ inputs.vault_path }}
          IMAGE: ${{ needs.build.outputs.image }}
          STACK: ${{ inputs.stack_name }}
          SERVICE: ${{ inputs.swarm_service }}
          STACK_FILE: ${{ inputs.stack_file }}
          SECRET_BASE: ${{ inputs.env_secret_name }}
          HEALTH_URL: ${{ inputs.health_url }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          KEY="$(mktemp)"; chmod 600 "$KEY"; printf '%s\n' "$SSH_KEY" > "$KEY"
          KNOWN="$(mktemp)"; LOCAL_STACK="$(mktemp)"
          trap 'rm -f "$KEY" "$KNOWN" "$LOCAL_STACK"' EXIT
          printf '%s %s\n' "$SWARM_HOST" "$HOST_KEY" > "$KNOWN"
          SSH_OPTS="-i $KEY -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$KNOWN -o ConnectTimeout=15"
          R="${SWARM_USER}@${SWARM_HOST}"
          REMOTE_STACK="$(ssh $SSH_OPTS "$R" 'mktemp --suffix=.yml')"
          SECRET_NAME="${SECRET_BASE}_${SHA:0:12}"

          # Busca o .env no Vault (mesmo padrao do pipeline.yml: secret/data/<client>/<env>/<service>).
          RESP=$(curl -sk -m 15 -H "X-Vault-Token: $VAULT_TOKEN" "$VAULT_ADDR/v1/secret/data/${VAULT_PATH}")
          echo "$RESP" | jq -e '.data.data' >/dev/null 2>&1 || { echo "ERRO: Vault read falhou em ${VAULT_PATH}: $(echo "$RESP" | jq -r '.errors[0] // "resposta invalida"')"; exit 1; }
          BAD=$(echo "$RESP" | jq -r '.data.data | to_entries[] | select((.value|tostring)|test("[\\n\\r]")) | .key')
          [ -z "$BAD" ] || { echo "ERRO: valores multilinha no Vault nao cabem em .env (chaves: $(echo $BAD | tr '\n' ' ')). Use base64."; exit 1; }
          APP_ENV=$(echo "$RESP" | jq -r '.data.data | to_entries[] | "\(.key)=\(.value)"')
          echo "Vault: $(echo "$APP_ENV" | wc -l | tr -d ' ') variaveis carregadas de ${VAULT_PATH}"

          # Docker secret e imutavel: cria uma versao nova por deploy e aponta o stack para ela.
          sed "s|^  ${SECRET_BASE}:\$|  ${SECRET_BASE}:\n    name: ${SECRET_NAME}|" "$STACK_FILE" > "$LOCAL_STACK"
          grep -q "name: ${SECRET_NAME}" "$LOCAL_STACK" || { echo "ERRO: bloco secrets '${SECRET_BASE}' nao encontrado em ${STACK_FILE}"; exit 1; }

          scp $SSH_OPTS "$LOCAL_STACK" "$R:$REMOTE_STACK"
          printf '%s' "$APP_ENV" | ssh $SSH_OPTS "$R" "docker secret inspect ${SECRET_NAME} >/dev/null 2>&1 || docker secret create ${SECRET_NAME} -"
          printf '%s' "$GHCR_TOKEN" | ssh $SSH_OPTS "$R" "docker login ghcr.io -u '${GHCR_USER}' --password-stdin >/dev/null"

          ssh $SSH_OPTS "$R" "IMAGE='${IMAGE}' docker stack deploy --with-registry-auth --resolve-image always --prune -c $REMOTE_STACK ${STACK}; rc=\$?; rm -f $REMOTE_STACK; exit \$rc"

          # Espera o service convergir e detecta rollback silencioso.
          for i in $(seq 1 30); do
            sleep 6
            RUN=$(ssh $SSH_OPTS "$R" "docker service inspect ${STACK}_${SERVICE} --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}'" | sed 's|@sha256:.*||')
            ST=$(ssh $SSH_OPTS "$R" "docker service inspect ${STACK}_${SERVICE} --format '{{if .UpdateStatus}}{{.UpdateStatus.State}}{{end}}'")
            echo "[$i] image=${RUN##*:} update=${ST:-none}"
            case "$ST" in
              completed|"") [ "$RUN" = "$IMAGE" ] && break ;;
              rollback_*|paused) echo "ERRO: deploy falhou (update=$ST)"; ssh $SSH_OPTS "$R" "docker service ps ${STACK}_${SERVICE} --no-trunc | head -5"; exit 1 ;;
            esac
          done
          [ "$RUN" = "$IMAGE" ] || { echo "ERRO: rodando $RUN, esperado $IMAGE"; exit 1; }

          if [ -n "$HEALTH_URL" ]; then
            for i in $(seq 1 20); do
              sleep 5
              ssh $SSH_OPTS "$R" "curl -fsS -m 5 '${HEALTH_URL}' >/dev/null" && { echo "health OK"; break; }
              [ "$i" = 20 ] && { echo "ERRO: health check falhou"; ssh $SSH_OPTS "$R" "docker service logs --tail 40 ${STACK}_${SERVICE}"; exit 1; }
            done
          fi

          # Limpa versoes antigas do secret (mantem as 3 mais recentes).
          ssh $SSH_OPTS "$R" "docker secret ls --filter name=${SECRET_BASE}_ --format '{{.CreatedAt}}|{{.Name}}' | sort -r | tail -n +4 | cut -d'|' -f2 | xargs -r docker secret rm >/dev/null 2>&1 || true"
          echo "Deploy OK: ${IMAGE}"
